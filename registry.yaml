# Skills registry — machine-readable discovery index.
#
# Every skill in the repo has an entry here. Flat skills (single SKILL.md, no
# leaves) have type: skill. Two-tier skills have a type: category entry for the
# router and type: skill entries for each leaf, with category linking them.
#
# Entry schema:
#   name         (required) — kebab-case slug; matches the SKILL.md frontmatter `name`
#   type         (required) — "skill" (a loadable SKILL.md) or "category" (a router over leaves)
#   sub_type     (required) — tool | method | cross-cutting | category
#   category     (required) — the top-level category the entry belongs to (self, for categories/flat skills)
#   path         (required) — repo-relative path to SKILL.md
#   description  (required) — discovery string; front-load tool/modality keywords
#   date_added   (required) — ISO-8601
#   tags         (optional) — cross-cutting discovery tags

entries:
  # =====================================================================
  # optical-imaging — category + 4 leaves
  # =====================================================================
  - name: "optical-imaging"
    type: category
    sub_type: category
    category: "optical-imaging"
    path: "optical-imaging/SKILL.md"
    description: "Optical recording of neural activity — router over calcium imaging (suite2p/caiman), fiber photometry, and voltage imaging leaves."
    date_added: "2026-08-18"
    tags: ["imaging", "calcium", "fluorescence"]

